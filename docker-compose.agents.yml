# Optional OpenAI-backed campaign agents. The API key is only sent to this worker.
services:
  agent-worker:
    build:
      context: .
      dockerfile: Dockerfile.source
    command: celery -A app.core.celery_app.celery_app worker --loglevel=INFO --concurrency=1 --queues=agent
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://audit:change-this-local-password@db:5432/audit}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in your local .env to start campaign agents}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-14}
      JOB_RETENTION_DAYS: ${JOB_RETENTION_DAYS:-30}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks:
      audit-net: {}
      agent-egress:
        gw_priority: 1
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1536m
    cpus: 1.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=500m,mode=1777
    restart: unless-stopped

networks:
  agent-egress:
    driver: bridge

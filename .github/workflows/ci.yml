name: Python CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Ruff and Mypy
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-source.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run Ruff
        run: ruff check app tests
      - name: Run Mypy
        run: mypy app

  test:
    name: Pytest, PostgreSQL, and Redis
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: audit_test
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: audit_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U audit -d audit_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://audit:audit_test_password@localhost:5432/audit_test
      REDIS_URL: redis://localhost:6379/0
      AUTHORIZED_HOSTS: demo-target,example.org
      DEMO_HOST: demo-target
      LOG_RETENTION_DAYS: "14"
      JOB_RETENTION_DAYS: "30"
      MAX_REQUESTS_PER_JOB: "3"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-source.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests with coverage gate
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=70

  docker-build:
    name: Validate Compose and build app and agent images
    runs-on: ubuntu-latest
    env:
      # Compose requires a non-empty value to render the optional agent service.
      # This placeholder is used only for config validation; it is never sent to a service.
      OPENAI_API_KEY: ci-validation-placeholder
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate the full campaign-agent Compose setup
        run: >-
          docker compose
          -f docker-compose.yml
          -f docker-compose.discovery.yml
          -f docker-compose.source.yml
          -f docker-compose.webscan.yml
          -f docker-compose.agents.yml
          config --quiet
      - name: Build the web and API image
        run: docker build --tag scopeguard:ci .
      - name: Build the isolated source and AI agent image
        run: docker build --file Dockerfile.source --tag scopeguard-agent:ci .
